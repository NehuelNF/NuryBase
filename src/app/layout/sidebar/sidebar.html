<aside class="sidebar" [class.collapsed]="collapsed()">
  <div class="sidebar-header">
    @if (!collapsed()) {
      <span class="brand">nury's</span>
    }
    <button
      type="button"
      class="toggle-btn"
      (click)="toggle()"
      [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Colapsar menú'"
    >
      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        @if (collapsed()) {
          <path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
        } @else {
          <path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" />
        }
      </svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    <ul>
      @for (item of visibleMenuItems(); track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: false }"
            [attr.title]="collapsed() ? item.label : null"
          >
            <span class="icon">
              @switch (item.icon) {
                @case ('tag') {
                  <svg
                    viewBox="0 0 24 24"
                    width="19"
                    height="19"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                  >
                    <path
                      d="M12.59 3H6a2 2 0 0 0-2 2v6.59a1 1 0 0 0 .29.71l9 9a1 1 0 0 0 1.42 0l6.59-6.59a1 1 0 0 0 0-1.42l-9-9a1 1 0 0 0-.71-.29Z"
                      stroke-linejoin="round"
                    />
                    <circle cx="8.5" cy="8.5" r="1.15" fill="currentColor" stroke="none" />
                  </svg>
                }
                @case ('cart') {
                  <svg
                    viewBox="0 0 24 24"
                    width="19"
                    height="19"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                  >
                    <circle cx="9" cy="20" r="1.4" />
                    <circle cx="17.5" cy="20" r="1.4" />
                    <path
                      d="M3 4h2.2l2.1 11.2a1.8 1.8 0 0 0 1.78 1.5h8.24a1.8 1.8 0 0 0 1.78-1.48L20.5 8H6.1"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                }
                @case ('cash') {
                  <svg
                    viewBox="0 0 24 24"
                    width="19"
                    height="19"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                  >
                    <rect x="2.5" y="6" width="19" height="12" rx="2" />
                    <circle cx="12" cy="12" r="2.5" />
                    <path d="M6 9h.01M18 15h.01" stroke-linecap="round" />
                  </svg>
                }
                @case ('box') {
                  <svg
                    viewBox="0 0 24 24"
                    width="19"
                    height="19"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                  >
                    <path d="M21 7.5 12 3 3 7.5l9 4.5 9-4.5Z" stroke-linejoin="round" />
                    <path d="M3 7.5v9L12 21l9-4.5v-9" stroke-linejoin="round" />
                    <path d="M12 12v9" />
                  </svg>
                }
                @case ('settings') {
                  <svg
                    viewBox="0 0 24 24"
                    width="19"
                    height="19"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                  >
                    <circle cx="12" cy="12" r="3" />
                    <path
                      d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                }
              }
            </span>
            <span class="label">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="sidebar-footer">
    <button
      type="button"
      class="logout-btn"
      (click)="logout()"
      [attr.title]="collapsed() ? 'Cerrar sesión' : null"
      aria-label="Cerrar sesión"
    >
      <span class="icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          width="19"
          height="19"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M10 17l5-5-5-5" />
          <path d="M15 12H3" />
          <path d="M19 4h1a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-1" />
        </svg>
      </span>
      <span class="label">Cerrar sesión</span>
    </button>
  </div>
</aside>
